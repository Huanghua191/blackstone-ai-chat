  title: "第二章 · 货币的秘密",
  text: "\"你这里有《交易报》吗？\"\n\n《交易报》是拜勒联邦发行量最大的报纸之一，内容主要是国家和国际性的一些金融经济趋势，以及地方的一些金融经济变化。\n\n福克斯先生瞥了一眼助手，助手点了点头，表示这里有。\n\n\"给我一份尽量早的，和一份最新的，我会让你明白我们之间的交易谁才是真正的赢家！\"林奇坚定有力的声音和他自信的表情，让福克斯先生开始隐隐的相信起来。\n\n几分钟后，福克斯先生的助手送来了两份报纸，一份是四个月之前的，一份则是这一周的。\n\n林奇打开报纸后翻阅了一段时间，大概十几分钟左右。福克斯先生一直没有打搅他，还让人给他送来了咖啡和香烟。他心里隐隐有一种期待，这个叫做林奇的普通人，一定会给他一个惊喜。\n\n这并非是无缘无故的猜测，这是他观察出来的。一个普通的普通人不可能在被邀请来的时候还可以保持冷静，更不可能在他展露了自己杀意的时候还可以和自己对视。\n\n他不是一个普通的孩子——以福克斯先生的年纪来说，林奇的确只是一个孩子，他只有二十岁。\n\n十几分钟后，林奇用手中的笔勾勒出了一些线条，然后把两份报纸同时放在了福克斯先生的面前。\n\n\"我在那些需要你阅读的内容下面划了横线，这样你可以更直观的看见它们。\"\n\n福克斯先生和他的助手都认真的看了起来，两人来回阅读了几遍之后并没有丝毫的头绪，上面都是一些房产中介的信息，他们根本没有发现任何东西。\n\n福克斯先生有些疑惑，\"我不知道这些代表了什么，它们有什么特殊的含义吗？\"\n\n林奇一点也没有烦躁，他很耐心。他走到了福克斯先生的身边，他的手下想要阻拦，却被福克斯先生制止了，这也意味着林奇获得了福克斯先生短时间里的信任。\n\n\"这份报纸上提供了两栋临街公寓的租赁信息，其中这套房子的租金是……\"，林奇指了指他划了横线的地方，没有继续说下去。\n\n福克斯先生下意识的接了一句，\"一百三十五块钱。\"\n\n林奇点了点头给予肯定，\"对，一百三十五块钱，我们先忽略掉其他东西，然后看看它旁边的房子多少钱……\"\n\n福克斯先生非常配合的把目光挪到了另外一份报纸上画了横线的信息上，继续非常配合的说道，\"一百七十二块钱！\"\n\n\"这两间公寓在马路的两边，并且直线距离不超过一百米，从这些价格的变化上，福克斯先生，你发现了什么？\"\n\n福克斯先生在沉吟了片刻后，已经开始认真的思考并说道，\"月租金增加了三十七块钱！\"\n\n在林奇过去成熟且成功的案例中，他始终相信一点，那就是让这些参与者更深层次的参与到案件中。他们会说服自己并且坚信自己得出的结论是对的。福克斯先生不是被林奇说服的，他是被自己得出的结论说服的。\n\n\"房租的提高意味着购买这些房子需要更多的钱，四个月的时间……\"，林奇说着顿了顿，\"不，实际上是每天都在提高，提高一点，你可能无法发现，但它的确再变化，你承认吗，福克斯先生。\"\n\n福克斯先生点了点头，\"那么这和我们之前的生意有什么关系？\"\n\n\"当然有，福克斯先生，这些房子就在那里，它不会随着时间的流逝发生改变。它在修建好的时候是什么样子，现在的它还是什么样子，它没有变的，是恒定的，但是价格发生了变化，这意味着什么？\"\n\n不等福克斯先生去思考，林奇就给出了答案。\n\n\"如果一个东西的价值并没有发生什么变化，但是它在'支付'的过程中出现了变化，只能说用于标对的东西价值产生了变化。\"\n\n\"换句话来说，在过去的四个月里，我们手里的货币……\"，林奇不知道什么时候从口袋里掏出了一枚硬币，卡在拇指和食指的关节之间。他轻轻的一弹，略微隐秘但又足以让人听见的金属震颤声吸引了人们的目光，福克斯先生，他的助手以及旁边的保镖，他们的目光都落在了这个飞起的硬币上。\n\n林奇自信的说道，\"一直在贬值，并且在四个月的时间里贬值了百分之二十二到百分之二十五左右，福克斯先生。\"\n\n逐渐明白过来的福克斯先生顿时感觉到有些惊悚，他改变了一下坐姿，硬着头皮说道，\"但是我们的利息很高，有些还是复利！\"\n\n\"我知道，福克斯先生，问题是我们贬值的货币并不是你那些可以拿出来的，放在人们面前的那些，而是你所有的资产！你所有的资产都在以每个月百分之五的速度贬值，而且这也是一种'复利'，如果你不能尽快把你的钱全部送到联邦税务局去完成最后的手续……\"\n\n林奇回到了桌子对面的椅子上坐下，他耸了耸肩，摊开了双手，\"你现在那些引以为傲的财富，可能几年后连个屁都算不上！\"\n\n\"你现在还在乎那微不足道的百分之十吗？\"",
  choices: [{ text: "\"百分之十，成交。\"", nextId: "first_gold" }]
},
first_gold: {
  title: "第三章 · 第一桶金",
  text: "福克斯先生点了点头，默认了这个交易。\n\n几天后，林奇站在了离出租屋不远的一处街头。\n\n\"先生，要报纸吗？\"\n\n一名带着有一顶脏兮兮鸭舌帽，挎着一个巨大的牛皮挎包的半大小子出现在林奇的面前。这个男孩看上去大概只有十一二岁的样子。\n\n林奇从口袋里掏出了一块钱的纸币，选了两份报纸。报童不断的感谢着林奇的光顾，甚至还不忘摘帽鞠躬。\n\n孩子准备离开，却被林奇喊了回来。\n\n\"想赚钱吗？\"\n\n孩子立刻点了点头，\"做梦都想先生，但是我不做违法的事情。\"\n\n有光明的地方就会有黑暗，黑暗把光明衬托的越光明，那么相反的，光明也会让黑暗愈发的黑暗。有人利用孩子们卖报，但也有人利用孩子们犯罪。\n\n林奇摇了摇头，\"你有九十七分吗？\"\n\n报童虽然有些迟疑，可还是很快的从口袋里掏出了九十七分。林奇再掏出了一块钱，并且把一块钱放在了孩子的左手里，并从他另外的手中取走了九十七分。\n\n林奇阻止了报童的动作，又重复的问了一句，\"想赚钱吗？\"\n\n报童还没有反应过来，可以第一次如此光明正大的占便宜让他有些不安，他犹豫了一下才点头说道，\"想，先生，做梦都想！\"\n\n林奇的脸上逐渐浮现的笑容让孩子彷如看见了刚刚升起的太阳，不刺眼，光线很温和，却能够撕裂黑暗，照亮整个天空！\n\n\"你有九十七分吗？\"他又问了一句。\n\n报童在短暂的错愕，震惊和不知所措后连忙掏出了包中的九十七分，托在手心里。他的脸色涨红，看得出他现在兴奋，紧张，忐忑，又有些怀疑。\n\n林奇又拿出了一块钱，放在了报童的手中，并且把他另外一只手里的九十七分拿走，他似笑非笑的又问道，\"你想赚钱吗？\"\n\n此时的报童激动的都哆嗦了起来，他连连点头把能凑成九十七分的零钱全部的找了出来，\"都在这了，先生……\"\n\n林奇数了十二块钱放在他的手中，并且把所有的零钱都装进了口袋，\"看来你只有这么多了。\"\n\n报童有些激动，虽然他只从林奇这边兑换了十四块钱的零钱，他自己的收入则已经有了四十二分，接近一块钱的一半了。\n\n把钱收好，报童有些犹豫的问了一句，\"先生，明天您还会在这里吗？\"\n\n林奇点了点头，\"在午餐之前，我都会在这里，如果我不在，那么第二天也会出现！\"\n\n大概十多分钟后，一群报童围在了这边，并且还有人不断的赶来。\n\n林奇的零钱兑换生意越做越大。他不需要自己跑腿，只需要站在街上，那些报童就会主动把零钱送来。很快，整个塞宾市的报头们都知道了有个人能以九十七分换一块钱——这意味着他们每换一百块零钱，就能净赚三块。百分之三的利润，在这个经济开始衰退的年代，足以让任何人动心。\n\n一周后，福克斯先生看着林奇推来的几大袋硬币，沉默了片刻。\n\n\"要数数吗？\"林奇直起腰活动了一下身体，没有形象的一屁股坐在了椅子上，掏出了一包烟点了一根，\"我可以等。\"\n\n福克斯先生摇了摇头，让手下把这些硬币拿走。他恍惚之间回过神来，看了看林奇，\"我应该支付你……\"\n\n\"去了零头，五百六十块。\"林奇很大方的抹掉了几块钱的零头。\n\n福克斯先生笑了笑，他拉开抽屉，里面摆放着许多钞票。他的手伸向了一百块面额的钞票时，林奇轻咳了一声，\"我觉得五块和十块的会更好一些，你觉得呢？\"\n\n福克斯先生不动声色的点了点头，数了五百六十块钱给他。如果有人拿着一百块面额的钞票在外面消费，这个家伙肯定会第一时间被某些部门盯上。如果林奇不出声，他们的生意也就仅限于硬币的交易。一个分不清轻重，不知道厉害，也没有足够小心和警惕心的人并不知道更深的接触，好在林奇顺利的度过了这一关。\n\n\"这样的速度太慢了，你有什么更好一点的办法吗？\"福克斯先生双手架在椅子的扶手上，微微偏着头看着林奇。\n\n林奇同样没有数的把钞票揣进了口袋里，\"过几天就会越来越多了，而且很快你的那些宝贝就能见光了。\"\n\n他所在的城市每天能够销售出去至少十万份报纸，换句话来说，即便全部都是本地报纸，这也代表着五万块钱的零钱。在他的影响力开始扩张出去之后，能把整个城市的零钱都吸过来。\n\n但这笔买卖不能长久做。税务局那边会盯上他，调查局也会调查他是否和这些人有过密的联系。他不想要成为福克斯先生那样的人，永远的躲藏在角落和阴影中，他想要做的是大亨，是传奇。\n\n他要站在聚光灯下接受人们的仰望与赞美，那才是他的生活。\n\n现在他所做的这些，都是为了能够尽可能完美的开局而已。",
  choices: [{ text: "📈 积累到足够的本钱，继续观察更大的机会", nextId: "michael_appears" }]
},
michael_appears: {
  title: "第四章 · 调查员的敌意",
  text: "财富闪烁着金光，会把迷失在贫穷迷雾中的人都吸引过来。\n\n但金光吸引来的，不只有渴望财富的普通人，还有那些喜欢挑刺的\"坏人\"。\n\n就在一周后的一天，林奇推着手推车走进洗衣店时，两名穿着黑色呢子风衣，穿着正装、小马夹以及白色衬衫的家伙出现在他的面前。其中一人撩开风衣的衣襟，露出了里面挂在口袋上的皮夹子，上面有他的证件。\n\n\"我是联邦税务局的调查员，需要你配合一下……\"\n\n林奇笑着问道，\"我要举高双手吗？\"\n\n他的这些话听起来像是在嘲弄两名调查员。林奇身后的家伙一手抓住他的手腕，一手抓住他的后领，把他抵在墙壁上。\n\n有一点狼狈的林奇揉着颧骨，他的脸被按在墙壁上的时候碰到了墙壁，有些疼。\n\n一名调查员正在翻弄他的手推车，把手推车的箱子打开，把一些旧衣服拿出来丢在地上。另外一个人则问道，\"最近你和福克斯走得很近，你在为他服务？\"\n\n面对凶神恶煞一般的调查员，林奇始终保持着笑容。笑容能够拉进人们之间的距离，也能让人放松警惕。\n\n\"我能知道你的名字吗？\"\n\n他面对着的调查员哂笑了一声，突然上前一步一拳打在林奇的胃部，霎时间让他的肚子里翻江倒海起来，还有一种反胃的冲动。\n\n\"你不需要知道我名字，你只要回答问题，懂吗？\"这名调查员抓着林奇的头发，让他弯着腰仰着脸仰望着自己。\n\n林奇脸上的肌肉抖了抖，缓缓的直起身。笑容重新出现在他的脸上，他用右手比划成手枪的模样，抵着自己的下颚，看着这名调查员说道，\"你有枪吗，给我一颗子弹尝尝……\"\n\n他的话让调查员短时间里都没有反应过来，紧接着就是羞恼，可当他迎上了林奇的目光时，却如同被当头浇了一盆冰水，彻底的熄火了。\n\n明亮剔透的眼睛里带着一种期待，配合他语气里的内容和一丁点令人心颤的癫狂，让调查员的心脏猛地收缩了一下。他能够清楚的感觉，这个人疯了！\n\n\"这里什么都没有……\"另外一名调查员把两个箱子里的旧衣服都丢了出来，连一个硬币都没有。\n\n两名调查员无功而返。\n\n……\n\n这名叫**迈克尔**的调查员不甘心失败。他又两次试图抓住林奇的把柄，但每一次都无功而返。\n\n第二次，他突击了林奇的临时居所，把房间里翻得一片狼藉，同样什么都没找到。第三次，他让自己的线人——一名掌管着大批报童的**报头**给林奇送了五千块做过记号的硬币，企图抓个现行。\n\n但林奇早就用紫外线灯检查过每一批硬币，那些记号在他眼里如同夜里的萤火虫一样耀眼。他把这些硬币倒进了下水道。\n\n三次失败让迈克尔在局里丢尽了脸面。他的上司告诉他，如果再不收敛，就要被调去偏远地区。\n\n但迈克尔不是一个会收敛的人。他把所有的怒气都发泄在他的线人身上。\n\n在一间小房间里，他在暴怒和咆哮声中举起了椅子，狠狠的摔在报头的背上。报头因为背部被椅子狠狠的砸了一下，面部的肌肉扭曲着纠结在一起。他有把柄在迈克尔的手中——他之前侵害了一个年轻的女孩，恰好被迈克尔发现了。迈克尔带走了那个女孩，同时也留下了报头认罪的录音和他亲手写下的犯罪经过。\n\n报头眼里泛着仇恨的光泽，但这股恨意很快就变得温顺起来。他无法反抗迈克尔。\n\n迈克尔揪着报头被汗水打湿的头发，\"安排你的人，今天下午给他送五千块钱的零钱过去，然后我们抓现场！\"\n\n但他的计划再次失败了。三次行动，三次失败。就在此时，一个噩耗传来——迈克尔的上司命令他暂时离开塞宾市，去库里兰市参与一个联合行动。\n\n迈克尔知道这是变相的停职。\n\n他咽不下这口气。在离开塞宾市的前夜，他闯进了林奇的住处，对着这个年轻人的腹部狠狠打了两拳。\n\n林奇没有还手。\n\n他只是看着迈克尔，用一种让对方心底发毛的平静语气说：\n\n\"你可以杀了我，他们也许会包庇你的小过失，但不会纵容并且帮你隐瞒你蓄意谋杀的事实。\"\n\n\"道歉，并且滚出去，这件事就到此为止。否则一切后果你自己承担。\"",
  choices: [
    { text: "📰 用舆论反击——联系记者，把迈克尔滥用职权的事公之于众", nextId: "media_path", setRoute: "media" },

  ]

  title: "第四章 · 舆论的风暴",
  text: "林奇选择了用舆论反击。\n\n他躺在医院的病床上，脸上毫无血色——这是他和医生谈好的条件。主治医师出具了一份\"重伤\"的诊断书，甚至短暂地下发了风险通知书。塞宾市联邦税务局局长**约翰逊**半夜被电话惊醒，连滚带爬地赶到了急救中心。\n\n\"一定要把林奇救回来，用最好的设备和特效药，联邦税务局买单！\"\n\n当林奇被推出急救中心的时候，所有人都松了一口气。但他们不知道，这一切都是林奇和医生的交易——医院拿到了丰厚的收入，林奇拿到了\"受害者\"的身份。\n\n接下来是媒体。在福克斯先生的帮助下，塞宾市本地的六家报社、州府的主流媒体、甚至两家联邦级别的报纸都派来了记者。林奇躺在病床上，用一种虚弱但坚定的语气，讲述了自己被迈克尔三次骚扰、两次殴打的经历。\n\n\"这是执法权的滥用，\"他对记者说，\"是对每一个联邦公民安全的威胁。\"\n\n记者们嗅到了大新闻的味道。第二天，他被殴打的照片出现在各大报纸的头版。《联邦税务局的拳头，打在每一个纳税人脸上》——这个标题让整个州都沸腾了。\n\n但林奇知道，舆论只能施压，不能定胜负。真正决定迈克尔命运的，是联邦税务局高层的一通电话。\n\n在舆论最沸腾的夜晚，林奇约了约翰逊局长在一家偏僻的烤肉店见面。约翰逊满头大汗地坐在林奇对面，他知道眼前这个年轻人手里攥着什么——攥着整个塞宾市税务局的面子，攥着约翰逊本人的退休金。\n\n\"我有一个提议，不知道你感不感兴趣。\"林奇一边吃着碎肉饼，一边用随意的口吻说道。\n\n他提出来的方案很简单：迈克尔的行为是\"个人行为\"，与税务局的执法权无关。迈克尔之所以针对林奇，是因为他的儿子小迈克尔入室盗窃了林奇的戒指，他想让林奇撤诉。这不是执法权的滥用，这是一个父亲为了包庇儿子的罪行知法犯法。\n\n\"这是谋杀！\"林奇轻声提醒了一句。\n\n约翰逊局长的手抖了一下。他明白林奇的意思——按照这个说法，迈克尔涉嫌的不是\"执法过当\"，而是\"蓄意谋杀\"。刑期会从三五年变成十年以上。\n\n\"你是一个好人，先生，但是你也应该知道事情的严重性。一边是一家一户一个劣迹斑斑的调查组组长，一边是整个联邦众多的执法部门。一个，或全部，这并不难选。\"\n\n约翰逊最终点了头。\n\n几天后，迈克尔的庭审在塞宾市城市法庭举行。法庭拒绝了所有媒体的旁听申请，采取了闭门审判。迈克尔面色苍白地站在被告席上，他的搭档、他的下属、甚至他保护过的线人都站到了控方一边。迈克尔·科里根，塞宾市联邦税务局调查组组长，被判刑九年。\n\n宣判后，林奇在法庭外的走廊上坐到了迈克尔身边。迈克尔抬起头，眼珠子通红。\n\n\"你来嘲笑我？\"\n\n林奇递了一根烟过去。迈克尔打掉了他的手。香烟翻滚着滚到了长椅下面。\n\n\"我们之间的恩怨，差不多结束了。\"林奇站了起来，俯视着他，\"你不用担心你的孩子，他在监狱里有很多男朋友。\"\n\n迈克尔暴起，揪住林奇的领子。林奇举着双手，笑着说：\"我要是你，我就会放开手。你还有妻子，她需要有人照顾。\"\n\n迈克尔的手松开了。\n\n林奇整理了一下领子，转身离开。他的脚步声在空旷的走廊里回响，越来越远。迈克尔僵在原地，看着林奇消失在走廊尽头的光线中，就像溺水一样，无法呼吸。",
  choices: [],
  ending: "【结局：舆论的代价】\n\n迈克尔被判九年，林奇赢得了这场战争。\n\n但这场胜利是有代价的。联邦税务局的高层记住了林奇这个名字。他们会一直盯着他，等待他犯错的那一天。\n\n林奇明白了一件事：在这个世界里，个人很难对抗整个系统。要想赢，就必须把系统的一部分变成自己的盟友。\n\n【Demo完·感谢试玩】\n\n原著：三脚架《黑石密码》"

  title: "第四章 · 一枚金戒指",
  text: "林奇没有选择正面冲突。\n\n他了解迈克尔这种人——暴脾气，有家庭，有一个正在上高中的儿子。他也有弱点。\n\n林奇去了一家偏僻的珠宝店，买了一枚普通的金戒指。他让店主在戒指内侧刻上了一行字——\"我的挚爱凯瑟琳\"。年轻的外表，英俊的面容，加上略显羞涩的笑容，很容易让上年纪的珠宝店老板心生好感。没人会怀疑一个为女友买戒指的年轻人。\n\n然后，他向塞宾市警察局报案，声称自己的住处被入室盗窃，丢失了这枚戒指。做笔录的警察同情地记录下每一个细节：\"里面刻着'我的挚爱凯瑟琳'，那是我准备送给我女友的礼物。\"\n\n现在，这枚戒指在警方的档案里已经是一枚\"赃物\"了。\n\n接下来，他只需要等待。\n\n林奇从福克斯先生那里要来了迈克尔的家庭地址。他发现迈克尔住在一个中产阶级社区，他的妻子很年轻，儿子在私立高中上学——都在他的保护之外。\n\n在一个迈克尔出差的夜晚，林奇换上了电工的制服，夹着装满油纸的写字板，压低帽檐，骑着自行车来到了迈克尔的社区。门口的保安拦住他，他指了指写字板上的维修单：\"我来检修线路，有人说看见了一些线路出现了老化开裂现象……\"保安挥挥手让他进去了。\n\n他顺着电线杆上的凸起部分爬了上去。在这个角度看，迈克尔房子的每个窗户都清晰可见。\n\n就在这时，一个黑影从社区后方摸了过来。\n\n那是报头——被迈克尔当出气筒殴打的线人。他的手里攥着一把改装的信号枪。报头鬼鬼祟祟地翻过了迈克尔的院墙，绕着房子转了一圈，推开了一扇没有关紧的窗户，钻了进去。\n\n林奇在电线杆上看着这一切。他没有出声，也没有动。\n\n几分钟后，二楼的灯亮了。一个女人的影子出现在窗帘后，然后是一声短暂的尖叫——立刻被掐断了。\n\n林奇默默地从电线杆上滑下来，朝着保安亭跑去。他告诉值班的保安，迈克尔的房子里可能闯入了不速之客。保安们立刻行动起来，警笛声很快在社区外响起。\n\n报头从房子里逃了出来，消失在夜色中。\n\n林奇等了二十多分钟，等警察勘查完现场、把迈克尔的妻子送往医院之后，才戴上手套，用自制的开锁工具打开了迈克尔的房门。安静的房子里还残留着打斗的痕迹。他直接上了二楼，进入了迈克尔的私人书房。\n\n书桌上摆放着一些文件和零散的零钱。\n\n林奇没有翻那些东西。他从口袋里掏出那枚刻着字的金戒指，拉开了书桌右下方的抽屉，把它小心翼翼地放在了里面。\n\n然后他关上抽屉，清理了一切自己来过的痕迹，锁上门，消失在夜色中。\n\n他什么都没做，只是放了一枚戒指。\n\n但这枚戒指会像一颗种子，在他离开之后，开始生根发芽。\n\n一枚刻着别的女人名字的金戒指，藏在一个有家庭的男人书房抽屉里。它会被谁发现？发现它的那个人会怎么想？会怎么做？\n\n林奇不需要亲自出手。他只需要种下这颗种子，然后静静地等待。\n\n他了解人性。",
  choices: [{ text: "⏳ 等待计划自然发酵", nextId: "ring_result" }]

  title: "第四章 · 塞宾市的新星",
  text: "一切如林奇所料。\n\n小迈克尔在父亲的书房里发现了那枚刻着\"我的挚爱凯瑟琳\"的金戒指。十六岁的少年根本不会想到这是一个局——他只知道母亲的名字不叫凯瑟琳。\n\n父亲背叛了家庭。这个念头像一颗子弹击穿了少年所有的安全感。\n\n更让他愤怒的是——他的母亲刚刚在医院里经历了一场可怕的入室侵害。那个闯入者已经被警方通缉，但小迈克尔发誓要亲手抓住他。他需要钱来找人。\n\n他把戒指攥在手心，决定卖掉它。\n\n他没有去社区附近的古董店——他知道那些老板认识他的父亲。他去了城市另一边的古董店，以为跑得够远就不会被发现。\n\n\"五百块，最少！这是纯金的！\"少年假装老练地和老板讨价还价。\n\n古董店老板戴着眼镜，低着眼睛看着手中不断翻滚的金戒指。他看见了戒指内圈的铭文——\"我的挚爱凯瑟琳\"。他认出了这枚戒指。\n\n这是警察局备案过的赃物。\n\n\"我需要用火烧一下，等我一分钟！\"老板说着走进了后面的房间。他提起电话，拨出了一个私人号码。\n\n警察赶到时，小迈克尔还被蒙在鼓里。他被两名警察按在柜台上，手铐咔嚓一声锁住了他的手腕。\n\n\"你们不能这样对我！我父亲是迈克尔·科里根！\"\n\n没有人理会他。\n\n消息传到迈克尔那边时，他还在外地出差。他连夜驱车赶回塞宾市，空旷的高速公路上，黑暗中只有他的车灯在闪烁。他到家时，妻子在医院，儿子在监狱，书房抽屉空空如也。\n\n他知道这一切都是林奇的局。\n\n但他没有任何证据。\n\n在绝望中，迈克尔冲到了林奇的住处，一拳打在这个年轻人的腹部。\n\n林奇没有还手。\n\n他喊了救命。楼下酒吧的人冲了上来。骑警的警哨声在远处响起。\n\n当着所有人的面，迈克尔·科里根——塞宾市联邦税务局调查组组长——被警方以暴力伤害、入室行凶的罪名当场逮捕。\n\n几天后的闭门庭审上，联邦税务局的高层做出了抉择。他们放弃了迈克尔。\n\n迈克尔因滥用职权、暴力伤害、入室行凶等多项罪名被判刑九年。他的搭档接替了他的位置，他的下属们迅速和他划清界限，他曾经的线人们纷纷站出来指控他曾经的暴行。\n\n小迈克尔在监狱里待了几个月后被无罪释放——他的父亲在狱中自首，承认是自己逼迫儿子承担了莫须有的罪名。但少年出狱时，家已经不复存在。\n\n而林奇，在这场风波中全身而退。\n\n他用一枚戒指，让一个几乎不可战胜的敌人亲手毁掉了自己。他从来不需要打败迈克尔——他只需要让迈克尔自己打败自己。\n\n站在塞宾市的街头，林奇看着这座正在迎来经济大萧条的城市，心中已经有了下一步的计划。他注册了公司，建立了交拍会，认识了市长，踏入了政界。他的帝国才刚刚起步。\n\n这个世界的规则，他已经摸透了。\n\n接下来的事情，就是把规则变成自己的武器。",
  choices: [{ text: "⏭️ 继续", nextId: "ch5_ring_intro" }]
},

  title: "第四章 · 地下世界的规则",
  text: "林奇去了福克斯的办公室。\n\n这次不是在阴暗的地下室——自从林奇帮他解决了洗钱的问题，福克斯已经搬到了市中心一栋明亮的二层楼里，门口挂着\"盖特瑙财务公司\"的铜制招牌。\n\n福克斯正坐在皮椅上抽着纯色柯乐芙，看见林奇进来，他笑着指了指对面的沙发。\n\n\"我听说了迈克尔的事。\"他弹了弹烟灰，目光落在林奇腹部的淤青上，\"那个杂种打你了？\"\n\n林奇没有回答，但沉默本身就是答案。\n\n福克斯站了起来，走到林奇身边，拍了拍他的肩膀。\"你是我的好朋友，林奇。我不能看着你被一个税务局的调查员欺负。我有律师——非常好的律师。他们能让迈克尔知道，你不是好惹的。\"\n\n林奇抬起头看着福克斯。他知道这不是免费的——在拜勒联邦的灰色地带，人情债是最难还的债。\n\n\"你为什么要帮我？\"林奇问。\n\n福克斯笑了。\"因为你值这个价。你的脑子比这座城市所有人加起来都好用。如果你被迈克尔弄进监狱，我的生意会受到影响——我们都不想看到这种事。\"\n\n林奇沉默了几秒，然后点了点头。\n\n三天后，迈克尔被他的上司叫到办公室。约翰逊局长把一封律师函拍在桌子上——福克斯的律师指控迈克尔在没有搜查令的情况下多次侵入私人住所、暴力伤害无辜市民、滥用职权进行非法调查。\n\n\"你惹了不该惹的人。\"约翰逊面色铁青，\"从现在起，你被调去库里兰市。没有我的命令，不准回来。\"\n\n迈克尔攥着拳头离开了。他没有被开除，但被发配到了偏远地区——一个正在调查跨国集团弊案的临时岗位，回来遥遥无期。\n\n林奇站在福克斯的办公室窗前，看着迈克尔的汽车驶出城区。福克斯递给他一杯威士忌。\n\n\"解决了。\"福克斯说，\"不过……以后我可能也会需要你的帮助。朋友之间，互相帮助，不是吗？\"\n\n林奇接过酒杯，抿了一口。他知道，这笔账记在了福克斯那里。至于什么时候还、怎么还——那是以后的事。",
  choices: [{ text: "⏭️ 继续", nextId: "ch5_fox_intro" }]
},
lay_low: {
  title: "第四章 · 静水深流",
  text: "林奇没有选择反击。\n\n他站在出租屋里，对着那面沾了水渍的镜子，看着自己腹部青紫色的淤青。迈克尔打的那两拳还没有完全消退，每次深呼吸都会隐隐作痛。\n\n他用手指轻轻按了一下淤青的边缘。疼，但他忍住了。\n\n他在心里做了一道算术题：他目前的本钱大概两万出头。和福克斯的交易每周能赚一千多。如果不出意外，到年底能攒到七八万。\n\n但迈克尔是税务局的调查组组长，他代表的是系统。一个二十岁的年轻人，和一个系统对着干——这不是勇气，是愚蠢。\n\n林奇给福克斯打了电话。\n\n\"最近风头太紧，交易频率要降低。\"\n\n电话那头的福克斯沉默了几秒。\"我理解。小心点总是好的。\"\n\n接下来的几周里，林奇把更多的时间花在了塞宾市的公共图书馆和街头的报摊。他每天都会翻阅《交易报》，尤其是金融板块。\n\n他开始注意到了一个奇怪的现象。报纸头版每天都有好消息——联邦工业指数再创新高，基金回报率超过百分之十五，交易所的交易量不断攀升。\n\n但在他每天走过的街道上，工厂一家接一家地关门。失业的工人们抱着装满家用电器和工具的纸箱从厂门口走出来，脸上没有愤怒，只有茫然。\n\n他在笔记本上写下一行字：实体经济与金融市场之间存在巨大的背离。这是泡沫的迹象。\n\n他还注意到另外一件事：《交易报》的国际版上，一篇不起眼的中缝报道提到，两大主要战胜国已经开始要求联邦政府偿还战争债券。这意味着过去几年涌入联邦避险的国际资本正在加速撤离。\n\n如果这些钱真的走了，会发生什么？\n\n林奇在笔记本上给自己出了这个问题，然后把这一页折了一个角。他有一种预感——这个问题，可能会改变他的一生。",
  choices: [{ text: "⏭️ 继续", nextId: "lay_low_2" }]
},
lay_low_2: {
  title: "第四章 · 渔翁得利",
  text: "迈克尔最终还是倒了。\n\n但不是因为林奇。\n\n在他隐忍的这几周里，其他被迈克尔压迫过的人站了出来。那些被他殴打过、羞辱过、威胁过的人——线人们、财务公司老板们、甚至他曾经的线人——联合向联邦税务局总部递交了举报信。\n\n报纸上不再只是报道林奇一个人的案子。更多受害者的名字出现在头版：《税务局的拳头，打向所有人》。\n\n约翰逊局长再也保不住迈克尔了。他被正式逮捕，面临多项滥用职权和暴力伤害的指控。庭审在塞宾市城市法庭举行——这次没有闭门审判，记者们把旁听席坐得满满当当。\n\n林奇没有去旁听。他只是在报纸上看到了最终结果：迈克尔被判七年。\n\n他看着报纸角落里那张迈克尔的照片——苍白的脸，深陷的眼眶，仿佛老了二十岁。这个几个月前还不可一世的调查组组长，如今成了一个囚犯。\n\n林奇放下报纸，走到窗前。街上还是那些人，推着手推车的蓝背心，拎着临期食品从超市回家的家庭主妇，在路边找工作的失业工人。\n\n他已经不是他们中的一员了。他手上有几万块钱的积蓄，有一个可靠的关系网，有对这个世界越来越清晰的认识。\n\n但他还没有真正出手。\n\n他只是在等待——等待那个让他觉得\"现在就是对的时候\"的时机。",
  choices: [{ text: "⏭️ 继续", nextId: "ch5_laylow_intro" }]
},
// ==================== 第五章过渡节点 ====================
ch5_ring_intro: {
  title: "第五章 · 新的舞台",
  text: "迈克尔被送进监狱后，林奇的名字在塞宾市已经无人不晓。他以近乎零代价的精密布局击败了一个税务局的调查组长，这让福克斯对他更加信任，也让街头的报童们视他为传奇。\n\n但林奇知道，这只是一个开始。\n\n他手上的资金已经累积到几十万，福克斯欠他的人情尚未兑现，街头巷尾都在谈论这个用一枚戒指就让税务局组长锒铛入狱的年轻人。\n\n声望、资金、人脉——他拥有了一个商人梦寐以求的一切。\n\n现在，他需要一个新的战场。",
  choices: [{ text: "⏭️ 继续", nextId: "auction_prep_ring" }]
},
ch5_fox_intro: {
  title: "第五章 · 人情的重量",
  text: "迈克尔被调离塞宾市后，林奇的生意恢复了正常。没有人再来找他的麻烦——至少在表面上。\n\n但福克斯开始频繁地请他吃饭。每一次餐桌上，福克斯都会聊到一个新的话题：他想投资电影，他需要林奇帮他看看哪些项目值得投资。\n\n林奇很清楚，这不是咨询。这是一种温和的索取——福克斯正在兑现那份\"人情\"。\n\n他欠福克斯的人情，这让他和福克斯的关系变得微妙。在商业合作中，福克斯开始以\"老朋友\"的身份要求更多的让利。林奇没有拒绝——他知道在这个游戏里，人情债是最难还的债。\n\n但他也在思考：这样的人情，还要还多久？",
  choices: [{ text: "⏭️ 继续", nextId: "auction_prep_fox" }]
},
ch5_laylow_intro: {
  title: "第五章 · 风暴前夕",
  text: "迈克尔的倒台没有让林奇觉得兴奋。他只是有一种淡淡的、理所当然的感觉——就像他在心里演算过的一件事，终于被验证了。\n\n敌人不一定要被自己打败，有时候敌人会自己打败自己。\n\n他把更多的精力投入到研究金融市场上。他发现国际资本的撤离速度比他在报纸上读到的更快——那些曾经涌入联邦避险的资金正在像退潮一样离开，留下的只有还在涨潮时盖起的高楼。\n\n他在笔记本上写下了一句话：\"当潮水退去，才知道是谁在果泳。\"\n\n现在他手上有几万块的积蓄，有一份对市场即将崩溃的预判，有一个可靠的关系网。但他还没有真正出手。\n\n他只是在等待——等待那个让他觉得\"现在就是对的时候\"的时机。",
  choices: [{ text: "⏭️ 继续", nextId: "auction_prep_laylow" }]
},
// ==================== 第五章：戒指路线 ====================
auction_prep_ring: {
  title: "第五章 · 拍卖会筹备",
  text: "福克斯带着林奇走进了他的仓库。\n\n仓库里堆满了东西——桌子、椅子、油画、地毯、甚至还有一套装在精美盒子里的象牙纯银餐具。这些东西卖不出去，每个月还要付仓储费。福克斯满脸愁容地站在一旁。\n\n自从迈克尔倒台之后，福克斯对林奇的态度发生了一些微妙的变化。以前他看林奇，是长辈看一个有天赋的年轻人。现在他看林奇，是看一个能用一个局就让税务局调查组组长身败名裂的人。他的眼神里多了一丝敬畏。\n\n\"那个老妇人送来的时候说，这是她退休时儿子送的礼物。\"福克斯指着那套象牙纯银餐具，\"我给了她一千七百块。\"\n\n林奇拿起餐具看了看，又放了下来。\"你给的价格高了点。象牙不值钱，银子也不值钱，两种不值钱的东西加在一起，也不会变成值钱的东西。那位老妇人一定是先去了古董店，才来你这里的。\"\n\n福克斯愣了一下，随即有些尴尬地笑了起来。\"你觉得它是假的？\"\n\n\"不管真假，都按假的处理。\"林奇把餐具放回盒子里。\n\n福克斯沉默了几秒，然后直入正题。\"林奇，这些东西太多了，卖不出去，还要付仓储费。你有什么办法吗？\"\n\n林奇看着满坑满谷的抵押品，嘴角微微上翘。他知道，福克斯这句话是在求他。不是因为他的脑子好用——这一点福克斯早就知道了。而是因为他是林奇，是那个用一枚戒指就扳倒迈克尔的人。福克斯不愿意得罪他。\n\n\"我全要了。协议价的七折。\"林奇说。\n\n福克斯几乎没有犹豫。\"成交。\"\n\n总共价值近五十万的商品，林奇只用三十多万就拿了下来。福克斯拿到现金后松了一口气，而林奇则开始筹备他的下一步计划。\n\n他需要一个团队。\n\n第二天，林奇来到了塞宾市社会服务局就业中心。他租了一个窗口，贴出了招募海报。很快，一个穿着老旧衬衫、系着廉价领带的年轻人坐在了他的对面。\n\n\"**理查德**。\"年轻人自我介绍道。\n\n林奇看了他的简历——几份培训学校的证明，一些小时候的奖项。他把简历丢在一旁。\n\n\"我的公司不需要这些没有说服力的东西，我需要的是能力。\"\n\n在理查德之后，又有几名年轻人加入了林奇的团队。其中最让林奇印象深刻的，是一个叫**伍德**的年轻人——他看上去很有精神，做事积极，但眼神里偶尔会闪过一丝不属于普通业务员的锐利。\n\n林奇给了这些年轻人一个承诺：销售利润对半分。每个月的销售冠军，如果收入不到一万块，林奇自掏腰包补上。\n\n在这个人均工资只有两三百块的年代，月入过万的承诺让所有人都红了眼睛。更何况——他们的老板是林奇，是那个连税务局都拿他没办法的年轻人。跟着他，绝对有前途。\n\n业务员们四散而去，开始在塞宾市的街头巷尾派发传单。林奇站在仓库门口，看着这些年轻人离去的背影。\n\n他有资金，有声望，有一个忠诚的团队。接下来的拍卖会，他势在必得。",
  choices: [{ text: "⏭️ 继续", nextId: "auction_day_ring" }]
},
auction_day_ring: {
  title: "第五章 · 拍卖会盛况",
  text: "周六下午，塞宾市体育馆。\n\n林奇站在体育馆二层的看台上，俯瞰着下方密密麻麻的人群。他租下了整个体育馆——自从他用一枚戒指扳倒迈克尔之后，塞宾市没有人敢小看他。他不需要低调，也不需要省钱。\n\n两千个坐席全部坐满，还有近千人站在过道和走廊上。人群中有失业的工人、省吃俭用的家庭主妇、甚至有几个穿着高档西装的中产阶级——他们是被传单上\"全州最大最全二手商品交易拍卖会\"的宣传语吸引来的。\n\n林奇请来了州府的专业拍卖师，花了六百块加路费。这个价格在人均工资两三百的年代算是一笔不小的开支，但林奇觉得值——好拍卖师能拉动至少百分之二十的成交价。\n\n第一件商品是一台嵌入式烤箱，商店售价一百九十九块。\n\n\"七十九块！\"拍卖师敲了一下木槌，\"有没有人举手？\"\n\n台下安静了大概三秒。然后，一个角落里的中年人举起了手。台上的灯亮了——那是林奇设计的抢拍提示系统，四个工作人员各控制一个按钮，谁反应最快，谁就能把灯点亮。\n\n\"恭喜这位先生！\"拍卖师喊道，\"七十九块就买走了一台几乎全新的烤箱！\"\n\n人们开始骚动。他们意识到，这里的东西真能便宜买走。\n\n第二阶段开始后，林奇抛出了今天最重磅的拍卖品——一栋公寓。按照商店里的报价，这栋公寓价值三万两千块。但林奇从福克斯手里拿到的价格只有两万出头。\n\n\"一块钱！\"拍卖师喊道，\"这栋房子的完全产权起拍价只有一块钱！\"\n\n全场沸腾。\n\n价格从一块开始，三千，五千，八千，一万……一直喊到两万七千多才停下来。最终拍下这栋房子的，是一个坐在伍德阵营里的中年男人。\n\n伍德满脸通红地从自己的座位上跳起来，跑到了理查德身边。两人低着头说了几句话，然后理查德给了他一拳，又搂着他的脖子揉了揉他的头发。这笔交易让伍德赚到了三千三百六十块——他半年卧底薪水的总和。\n\n第三阶段的象牙纯银餐具拍卖时，拍卖师的声音变得诡异起来。\"三千八百九十九——有没有人举手？三千六百块——一口砍掉三百块！三千四百块……\"\n\n价格越来越低，人们的呼吸越来越急促。当价格喊到一千九百八十块时，一只颤抖的手举了起来。\n\n\"成交！\"\n\n从下午一点半到晚上七点，整场拍卖会持续了五个多小时。当最后一千条皮带被领取走之后，林奇在办公室里拿到了最终的数据。\n\n交易总额：四十九万七千块。\n\n在这个工人们月入两三百的年代，一个下午，创造了近五十万的交易额。\n\n林奇把这个数字念给在场的所有人听——包括他手下的业务员们，包括**薇菈**，包括那些半大的报童。然后他宣布了每个人的提成数额。\n\n理查德拿到了四千一百块，激动得脸色通红。伍德拿到三千七百多块，整个人都傻了。那几个报童合起来拿了八千多块——因为他们手里的传单覆盖面最广，来的人最多。\n\n\"今天晚上，所有人去酒店。\"林奇说，\"我请客。\"",
  choices: [{ text: "⏭️ 继续", nextId: "auction_celebration_ring" }]
},
auction_celebration_ring: {
  title: "第五章 · 庆祝之夜",
  text: "林奇包下了塞宾市假日酒店的三楼小会议厅。\n\n两边的长桌上摆满了各色食物——烤牛排、煎鱼排、堆成小塔的甜点、冰镇着的香槟。乐队在舞台上演奏着舒缓的爵士乐，一名在本地小有名气的女中音用慵懒的嗓音唱着流行的情歌。\n\n理查德穿着他那件老旧的衬衫，站在长桌旁，盯着那些食物看了好一会儿。他这辈子从来没进过这种地方——不是他没想过，而是他不够格。但现在，他够格了。\n\n林奇走上舞台，手里拿着两瓶香槟。他踩着鼓风机的开关，对着麦克风喊了一声：\"今天晚上，不醉不归。\"\n\n然后他举起香槟，把酒水浇在了身边两个模特的头上。\n\n那两个女孩一开始吓了一跳，但很快就开始在酒水中扭动身体跳起舞来。然后鼓风机开始转动——不是吹风，是吹钞票。林奇让工作人员把一沓沓的现钞丢进鼓风机里，钞票打着旋飞得到处都是。\n\n整个会议厅都疯了。\n\n理查德趴在地上捡钱，一边捡一边笑。伍德站在那里，被一个穿着亮片裙的女孩拉着跳舞，他的脸红得像喝了三杯威士忌——事实上他确实喝了。那些模特被经纪公司送来时，只被告知要\"活跃气氛\"，但没有人告诉她们，在这里活跃气氛能捡到满地的钞票。\n\n林奇从人群中挤出来，送薇菈和另外一名女会计先离开。在酒店门口，薇菈坐进车里之后突然摇下车窗，在林奇的脸颊上亲了一下。\n\n\"你是个了不起的年轻人。\"她说，然后关上了车窗。\n\n林奇摸了摸被亲过的脸颊，忍不住笑了一声。他回到会议厅时，地上已经躺满了人——有些人喝醉了，有些人只是太兴奋了。那些半大的报童们还醒着，他们把没吃完的牛排用纸包好，小心翼翼地装进随身携带的布袋里。\n\n看见林奇走过来，为首的那个大孩子有些紧张地站起来。\"林奇先生，我们不是……\"\n\n\"带回去给其他人吃。\"林奇说，\"明天早上九点，来仓库找我。\"\n\n那孩子用力点了点头。\n\n林奇穿过满地狼藉的会议厅，走到窗户前。他看着窗外的夜色，玻璃上映出他自己的脸。年轻，英俊，野心勃勃。\n\n曾经他只能吃女友从超市带回来的临期食品。现在他包下了整个酒店的会议厅，把钞票当纸屑撒。\n\n这只是一个开始。",
  choices: [{ text: "⏭️ 继续", nextId: "mayor_attention_ring" }]
},
mayor_attention_ring: {
  title: "第五章 · 市长的邀请",
  text: "拍卖会结束后的第三天，林奇的办公桌上多了一封印着火漆的信件。\n\n寄信人是**费拉勒**，塞宾市市长兰登的亲随官。信的内容很简单：市长阁下听说林奇先生在拍卖会上创造了近五十万的交易额，认为这是一项有益于塞宾市民生的商业活动。市长希望能和林奇先生共进午餐，探讨进一步合作的可能。\n\n林奇看完信后把它折好，放进了抽屉里。他知道这顿饭不只是饭——是市长向他递来的橄榄枝。\n\n午餐安排在一家私人俱乐部。林奇提前十分钟到达，穿着他最得体的深灰色西装。他在俱乐部大厅坐了片刻，然后被引到一个装修典雅的包间。长桌上已经铺好了酒红色的桌巾，两套餐具在灯光下闪着银光。\n\n**兰登市长**迟到了五分钟——这个时间卡得很微妙，既不会让人觉得被怠慢，又能让来客感受到双方身份的差异。但当他在餐桌对面坐下时，脸上的笑容是真诚的。\n\n\"林奇先生，久仰大名。在报纸上见过你的相片，但本人更年轻。\"\n\n\"市长阁下，感谢您在百忙之中抽出时间。\"林奇得体地回应，但紧接着话锋一转，\"我知道您的时间非常宝贵，所以请允许我直奔主题。\"\n\n兰登市长挑了挑眉。他见过很多商人在他面前战战兢兢、阿谀奉承，但林奇不是那样的人。这个年轻人有一种和他年龄极不相称的从容，甚至可以说是——强势。\n\n\"请。\"\n\n\"我有两个想法。\"林奇说，\"第一，我想把拍卖会推广到全州的每一个城市。塞宾市只是起点，我可以建立一个覆盖全州的二手商品流通网络。这需要政策支持——集会许可、场地使用、税收减免。\"\n\n兰登市长没有立刻表态。他在政坛摸爬滚打二十多年，太清楚商人们的套路了——先画一张大饼，然后伸手要补贴。但他没有阻止林奇，只是示意他继续。\n\n\"第二，我在和福克斯先生合作的过程中发现了一个问题：塞宾市的很多中小企业主正在面临财务困境。他们的资产被银行压价抵押，他们的商品滞销，他们的工人面临失业。我的拍卖会只解决了二手商品的问题——但如果能和银行合作，提供以实物资产为担保的融资渠道，就能帮助这些中小企业渡过难关。\"\n\n兰登市长端起咖啡杯抿了一口。现在他开始认真倾听这个年轻人的话了。\n\n\"所以你想要什么？\"他问。\n\n\"场地、政策、以及您的背书。如果您愿意把塞宾市体育馆免费租借给我作为拍卖会场，并且支持我把这个模式推广到全州，我可以在明年春节前为塞宾市创造至少八百个工作岗位。\"\n\n兰登市长放下咖啡杯。他一直在为这几件事头疼：经济衰退、失业率飙升、里斯托安集团在闹脾气。如果有人能帮他解决其中哪怕一项，他就有政绩可以向州政府交差。而林奇——这个还没满二十一岁的年轻人——承诺可以帮他解决不止一项。\n\n但他还有一个更核心的问题。他看着林奇，\"林奇先生。你对联邦进步党怎么看？\"\n\n这个问题让包间里的空气突然变得微妙起来。从政治上来说，市长在问他的政治立场。但林奇知道，更深层的意思是——如果我给你政策扶持，你会不会在政治上支持我？\n\n林奇抬起头，毫不犹豫地回答：\"进步党是一个积极推动变革的党派。进步党主张承担更多国际责任，从人道主义救援开始，一步步把联邦推向国际舞台的中心。我认为这是联邦未来唯一正确的方向。\"\n\n兰登市长微微睁大了眼睛。这番话不只是空洞的表忠心——它精准地触及了进步党目前最核心的外交理念。这个年轻人研究过进步党的政治纲领。他不是在讨好市长，他是真的理解这个国家的政治走向。\n\n\"林奇先生，塞宾市有一家职业橄榄球俱乐部，已经废置三年了。\"兰登市长突然提起一个完全不相干的话题，\"联运会每年出钱维持它的基本开销，但没有人愿意接手。如果你能接手这家俱乐部，让它重返职业联赛——\"\n\n他顿了顿，直视着林奇的眼睛。\"那么，关于你刚才提到的体育馆使用权、政策扶持、地皮，我们都可以接着谈。\"\n\n林奇在心里快速计算了一笔账。一家职业橄榄球俱乐部每年的运营费用至少三十万到五十万块。但回报是什么？\n\n第一，市长承诺的地皮——如果拿到城南那一大片空地，仅仅是土地就值上百万。第二，职业体育俱乐部的经营者可以获得大量的政府补贴和税收减免。第三，这是和市长建立长期利益关系的最快途径——他帮市长解决了一个三年没人接手的烂摊子，这下他不再只是\"一个能赚钱的年轻人\"，而是市长必须保住的盟友。\n\n\"可以。\"林奇说，\"但我有一个条件——我需要在城南的空地上建一个全新的训练基地，以及一个综合性的体育中心。包括女子橄榄球。\"\n\n兰登市长愣了一下。\"女子橄榄球？\"\n\n\"是的。我相信这项运动将为塞宾市创造很多就业机会——并且它能吸引整个联邦的目光。\"\n\n兰登市长深深地看了林奇一眼，然后端起咖啡杯笑了笑。\"很有意思。那么，详细方案由你的团队和我的办公室对接。费拉勒会负责。\"\n\n林奇从俱乐部出来时，费拉勒送他到门口。在临别时，林奇从口袋里掏出一张早已写好的支票，塞进了费拉勒手里。\n\n\"这是……？\"费拉勒低头看了一眼——七万五千块。\n\n\"这是我代表本公司员工和商业伙伴，对市长阁下和进步党的政治献金。\"林奇微笑着说，\"请你帮忙入账。\"\n\n费拉勒收下支票，表情变得更加友善了。他知道林奇是个懂规矩的人。\n\n林奇回到车上，关上车门。引擎声响起，银色豪车驶出俱乐部的停车场。他靠在真皮座椅上，嘴角不自觉地上扬。\n\n他不是来求市长的。他是来和市长做交易的。\n\n如今，这个交易已经完成了。",
  choices: [],
  ending: "【第五章完·戒指路线】\n\n林奇用一枚戒指扳倒了不可一世的税务官，用一场拍卖会震惊了整个塞宾市，又用一顿午餐赢得了市长的支持。\n\n他拿到了体育馆，拿到了地皮，拿到了政策扶持。他的声望如日中天，他的团队初具规模，他的商业帝国才刚刚起步。\n\n但联邦税务局的名单上，仍然写着他的名字。\n\n里斯托安集团正在暗中筹划叛逃。\n\n卧底探员伍德在他的团队里越陷越深。\n\n以及——一场席卷整个拜勒联邦的金融风暴，正在看不见的地方酝酿。\n\n当风暴来临时，所有人都只是风中的落叶。\n\n但林奇，要成为驾驭风暴的人。\n\n【Demo完·感谢试玩】\n\n原著：三脚架《黑石密码》"
},

auction_prep_media: {
  title: "第五章 · 拍卖会筹备",
  text: "福克斯带着林奇走进了他的仓库。\n\n仓库里堆满了东西——桌子、椅子、油画、地毯、甚至还有一套装在精美盒子里的象牙纯银餐具。这些东西卖不出去，每个月还要付仓储费。福克斯满脸愁容地站在一旁。\n\n自从报纸上铺天盖地报道了林奇的名字之后，福克斯对林奇的态度变得有些微妙。一方面是欣赏——这个年轻人用舆论就把迈克尔送进了监狱；另一方面是警惕——林奇和税务局高层虽然达成了协议，但那些人一定会盯着他。如果林奇再出什么错，后果不堪设想。\n\n\"这些东西太多了，卖不出去。\"福克斯直入正题，\"你有什么办法？\"\n\n林奇拿起那套象牙纯银餐具看了看。\"这批货我全要了。但价格需要再谈——我现在不能太张扬，拍卖会规模需要控制。\"\n\n福克斯想了想，点了点头。\"七五折。这是我最大的诚意。\"\n\n林奇同意了。总共价值近五十万的商品，他用了大约三十七万拿下来。对他来说，此刻更重要的是安全，而不是多赚几万块钱。\n\n他需要一个团队。\n\n第二天，林奇来到就业中心招募业务员。来的人比预期的少一些——有些人看到报纸上林奇的名字，觉得他是个\"对抗税务局的人\"，不太敢来。但林奇用自己的话术说服了其中几个最有冲劲的年轻人。\n\n其中最积极的，是**理查德**。他穿着一件老旧的衬衫，系着一条廉价领带，说话时眼睛里闪着一种林奇很熟悉的光——那是对财富的渴望。\n\n\"没有底薪，但利润对半分。做得好，一个月能赚别人一年的工资。\"林奇说。\n\n理查德几乎没有任何犹豫就点了头。\n\n在理查德之后，又有几名年轻人加入。其中有一个叫**伍德**的，看上去很精神，做事积极。\n\n林奇给团队定下了基调：这一次拍卖会，规模不要太大，但利润一定要高。他不能被税务局抓到任何把柄。\n\n业务员们四散而去。林奇站在仓库门口，看着他们离去的背影。\n\n他有名声，有资源，但也有一双随时盯着他的眼睛。接下来的每一步，都要走得更小心。",
  choices: [{ text: "⏭️ 继续", nextId: "auction_day_media" }]
},
auction_day_media: {
  title: "第五章 · 拍卖会盛况",
  text: "周六下午。\n\n林奇没有租用体育馆。不是因为他租不起——而是因为他不想太张扬。自从那次闭门审判之后，联邦税务局的高层记住了他的名字。他们虽然没有找他麻烦，但一定在暗中盯着他。他选择把拍卖会安排在老地方——仓库区的空地上。\n\n尽管如此，来的人还是超过了他的预期。一千五百个坐席几乎坐满，还有至少五百人站着。传单上那句\"免费领取皮带\"的噱头，在经济衰退的塞宾市有着强大的吸引力。\n\n林奇站在仓库管理处的二楼办公室里，透过窗户看着下方的人群。他的身边站着**薇菈**——那个受雇于他的女会计。\n\n\"你觉得今天能卖多少？\"薇菈问。\n\n\"至少三十万。\"林奇说。\n\n薇菈的眼睛微微睁大了。三十万，比她丈夫一年的薪水还多好几倍。\n\n第一件商品是一台二手洗衣机，商店售价接近四千块。拍卖师从原价开始喊，每隔几秒就降一口价。降到两千零五十块时，有人举了手——这个人打算把洗衣机放到自己的出租楼里商用，五十分洗一次衣服，一个月就回本。\n\n第二阶段的竞价环节，一栋城郊公寓从一块钱一路喊到两万一千多。人群开始骚动——他们亲眼看见一个人只用了几分钟就赚了几千块的差价。\n\n第三阶段，林奇让拍卖师拿出了一套全新的象牙纯银餐具——这是福克斯仓库里最贵的一件奢侈品。从三千八百九十九一口气降到一千七百五十块才成交。\n\n晚上七点，拍卖会结束。林奇坐在他那间简陋的办公室里，看着桌上摊开的账本。\n\n总交易额：三十三万四千块。\n\n在这场精心控制规模的拍卖会上，林奇赚到了将近八万块的纯利润——足够他安抚那些说他\"太谨慎\"的人，也足够他继续自己的下一步计划。\n\n当他宣布提成数额时，理查德的眼睛湿润了——他拿到了两千九百块，这是他人生中最大的一笔钱。伍德拿到了两千出头，他用拳头轻轻捶了一下桌子，不知道是在兴奋还是压抑着什么。\n\n\"晚上，我请大家吃顿饭。\"林奇说，\"但规模不要太大。\"\n\n他仍然记得，有一双眼睛在盯着他。",
  choices: [{ text: "⏭️ 继续", nextId: "auction_celebration_media" }]
},
auction_celebration_media: {
  title: "第五章 · 低调的晚餐",
  text: "林奇没有包酒店。\n\n他选了一家比较安静的餐厅，包了一个包间。来的人不多——理查德、伍德、薇菈，还有几个核心的业务员。没有模特，没有乐队，没有鼓风机。\n\n不是他舍不得花钱。而是他不确定税务局的人会不会在某个角落里盯着他。自从那次闭门审判之后，联邦税务局的高层记住了他的名字。他们说过不会找他的麻烦——但\"不会找麻烦\"和\"不会盯着你\"是两回事。\n\n\"干杯。\"林奇举起酒杯。\n\n理查德第一个站起来，激动得语无伦次。\"林奇先生，我跟定你了。这辈子，我就跟着你干。\"\n\n他说这话的时候，眼睛里闪着一种近乎宗教狂热的光。一个月前，他还穿着廉价的旧衬衫到处找工作；现在，他口袋里揣着两千九百块的分红。\n\n伍德的反应没那么激烈。他只是坐在座位上，举起酒杯，喝了一小口。他的目光偶尔飘向窗外，似乎在寻找什么。林奇注意到了，但没有说破。\n\n晚餐快结束时，包间的门被敲响了。\n\n进来的不是服务员。是一个穿着体面、头发有点稀疏的中年男人。林奇见过他——在市长办公室里，他叫**费拉勒**，是市长兰登的亲随官。\n\n\"林奇先生。\"费拉勒的脸上带着一种不太自然的笑容，\"我听说你的拍卖会非常成功。\"\n\n林奇放下酒杯，微笑着问道：\"费拉勒先生，你是来祝贺我的？\"\n\n\"算是。\"费拉勒在空椅子上坐下，\"不过有件事我需要提醒你——超过五十人的集会，需要提前一周向社会服务局申请。\"\n\n林奇扫了一眼薇菈，后者微微摇了摇头，表示她不知道这个规矩。\n\n\"看来我忘了。\"林奇说，\"那现在怎么办？\"\n\n费拉勒没有回答这个问题。他只是拿起了桌上的一杯香槟，对林奇举了举。\"也许我们可以谈谈——单独谈谈。\"",
  choices: [{ text: "⏭️ 继续", nextId: "mayor_attention_media" }]

mayor_attention_media: {
  title: "第五章 · 烤肉店的交易",
  text: "拍卖会结束后的第三天，费拉勒再次出现在林奇的办公室门口。\n\n这一次他没有穿正装，而是换了一身便服，看起来像是周末出来散步的普通中年男人。但林奇不会天真到以为他是来闲聊的。上一次在庆祝晚餐上，费拉勒用\"集会许可\"的理由暗示了市长在盯着他。这一次，他直接带来了话。\n\n\"林奇先生，市长阁下对你的拍卖会印象非常深刻。\"费拉勒坐在林奇对面的椅子上，手指交叉放在膝盖上，\"他让我转达——这是一个很好的商业创意。\"\n\n\"谢谢。\"林奇不动声色。\n\n\"但他也让我提醒你——根据市政厅的政策，超过五十人的集会需要提前向社会服务局申请。你的拍卖会，似乎没有走这个流程。\"\n\n林奇心里很清楚，这不是来找茬的。如果是找茬，来的就不会是费拉勒一个人，而是一群穿制服的。费拉勒是在给他递一个台阶——一个让他主动开口\"寻求帮助\"的台阶。\n\n\"费拉勒先生，我对这些政策确实不太熟悉。也许我该请一个顾问——一个熟悉市政厅运作的人。不知道你有没有兴趣？\"林奇掏出支票本，写了一个数字，撕下来放在桌上，\"这是这个月的顾问费——五千块，税后。\"\n\n费拉勒低头看了一眼支票。五千块，还注明是税后。在这个文员月薪两三百的年代，这笔钱够他一整年的工资。他拿起支票，收进上衣内袋，动作非常自然，就好像这是一张名片，而不是一笔足够让调查局找麻烦的款项。\n\n\"林奇先生，我正好有一些关于政策方面的建议——关于集会许可的问题，其实只要拍卖会被定义为'市政推动的惠民活动'，就不需要提前申请。市长阁下正好在推动几项惠及民生的政策，你的拍卖会完全可以纳入其中。\"\n\n\"那太好了。请问我应该向哪个部门提交？\"\n\n费拉勒摇了摇头。\"你不需要提交。如果市长阁下认可了，会有专门的人来通知你怎么做。\"\n\n这句话让林奇确认了自己的判断——市长不是来找茬的，是来找\"合作\"的。他端起了办公桌上的咖啡杯，\"那么……市长阁下什么时候有空？\"\n\n费拉勒拿出一个笔记本，翻了几页。\"下周二，午餐时间，只有四十分钟。\"\n\n\"我记住了。\"林奇放下咖啡杯。\n\n费拉勒起身告辞，走到门口时转过身来。\"对了，林奇先生——市长阁下对进步党的支持者总是格外欣赏。\"\n\n林奇微笑着点头称谢，但在这番话里听到了真正的信息——作为进步党政客，他现在非常需要一个能展示其\"创造经济成果\"的商业界支持者。这个机会落在了林奇身上，同样也意味着林奇将被绑定在进步党的战车上。\n\n周二中午，市中心私人俱乐部的包间里，林奇面对面坐在了兰登市长面前。市长看起来比报纸上的照片更苍老——眼角的皱纹，略有些松垮的下巴，但眼睛仍然锐利。\n\n\"你的拍卖会我看到了。\"兰登市长开门见山，\"近三十四万的交易额，一千五百多人参与。在经济衰退的当前创造了消费需求和就业机会，这正是我在推动的。但我听说，你之前在税务方面有些……不太顺利？\"\n\n林奇平静地回答：\"那是过去的事了。迈克尔已经被判刑，我和塞宾市税务局之间没有任何未了结的问题。\"\n\n\"很好。\"兰登市长端起咖啡杯示意，\"联邦进步党一直倡导经济自由化、贸易开放和保护企业家合法正当利益。我想，或许你可以考虑一下——在政治上表达自己的立场？\"\n\n\"我已经是进步党的成员了。\"林奇说，\"通过市长阁下您——如果我没记错的话，上个月我在市政厅填写了入党申请。\"\n\n兰登市长对这个回答很满意。这个年轻人不仅会赚钱，还懂政治规矩。他放下咖啡杯，用手指在桌子上轻敲了两下。\"把你的拍卖会推广到全州，明年年底前提供五百个工作岗位——这是我的期待。你能做到吗？\"\n\n\"一千个。\"林奇不假思索地答道。\n\n兰登市长微微挑眉。\"口气不小，能给我一个理由吗？\"\n\n\"因为您的支持。有了市政厅的场地和免税政策，我可以在每一个城市复制塞宾市的模式。同时，这个项目会为您提供一份漂亮的政绩——在经济最困难的时候，是兰登市长推动了这项惠及数十万家庭的民生工程。\"\n\n兰登市长沉默了几秒。然后他从西装口袋里取出一支钢笔，在费拉勒递上来的备忘录上签下了自己的名字。\"下周二中午，你再来一趟，带一份完整的计划书。我们来谈谈那个被你承诺的'一千个工作岗位'。\"",
  choices: [],
  ending: "【结局：舆论的平衡】\n\n舆论路线的林奇用一场精心控制规模的拍卖会证明了：在被盯着的处境下，低调反而是最强的保护色。\n\n他没有戒指路线林奇那么风光，但他换来了更安全的发展空间。费拉勒两次登门——第一次是提醒，第二次是送橄榄枝。市长在谈话中主动提及了税务问题，这反而给了林奇一个当面表忠心的机会。\n\n他用五千块的顾问费打开了市长办公室的门，用一千个工作岗位的承诺换来了市长的签字。\n\n他的名声在税务局那里是一个隐患，但在市长这里却是一个筹码——因为市长需要展示他对有才华的年轻人的包容和支持。\n\n当风暴来临时，低调的人往往能走得更远。\n\n【Demo完·感谢试玩】\n\n原著：三脚架《黑石密码》"
},

auction_prep_fox: {
  title: "第五章 · 拍卖会筹备",
  text: "福克斯带着林奇走进了他的仓库。\n\n仓库里堆满了东西——桌子、椅子、油画、地毯、甚至还有一套装在精美盒子里的象牙纯银餐具。这些东西卖不出去，每个月还要付仓储费。\n\n但这一次，福克斯的表情不是愁容，而是带着一丝若有若无的笑容。\n\n\"林奇，我的朋友。\"他拍了拍林奇的肩膀，\"你能用一枚戒指扳倒迈克尔，我当然相信你能帮我处理掉这些东西。不过……你知道的，我们是朋友，互相帮助。\"\n\n林奇沉默了一秒。他知道这句话的意思——他在暗示之前欠下的那个人情。在拜勒联邦的灰色地带，人情债是最难还的债。\n\n\"我要这批货。\"林奇说，\"你开价。\"\n\n\"八折。\"福克斯笑着说，\"这是朋友价。\"\n\n林奇心里算了一下——比戒指路线整整高了一折，多付了近五万块。但他没有讨价还价。不是因为他不在乎这笔钱，而是因为他知道，在这个游戏里，有些代价是必须付的。\n\n\"成交。\"林奇说。\n\n福克斯笑得更开心了。他递了一支纯色柯乐芙给林奇，亲手为他点燃。\"我就知道我们可以一直合作下去。\"\n\n林奇需要组建自己的团队。\n\n第二天，他来到就业中心。和之前几次招募一样，他用自己的话术说服了几个年轻人加入。其中最积极的，是**理查德**——一个穿着老旧衬衫、但眼睛里闪着贪婪光芒的家伙。\n\n\"没有底薪，但利润对半分。\"林奇说。\n\n理查德毫不犹豫地点了头。\n\n还有**伍德**，一个很精神的小伙子，做事积极，对林奇的商业理念似乎很感兴趣。\n\n团队组建完成后，林奇站在仓库门口，看着堆积如山的商品。他手里有货，有人，有分销渠道。唯一的问题是——他的启动资金比预期少了五万块，因为福克斯的人情债。\n\n但林奇并不担心。他甚至觉得，这五万块花得值。因为只要他还在这个灰色地带里做生意，福克斯的人脉和关系网就永远是他的资源。\n\n只是他也在想——这样的人情债，还要还多少次？",
  choices: [{ text: "⏭️ 继续", nextId: "auction_day_fox" }]

  title: "第五章 · 拍卖会盛况",
  text: "周六下午，仓库区的空地上。\n\n林奇站在他办公室门口，看着下方热闹的场面。但他今天不是一个人——福克斯先生带着他的儿子小福克斯，还有几个手下，坐在林奇旁边临时搭建的贵宾席上。福克斯戴了一顶巴拿马草帽，嘴里叼着纯色柯乐芙，脸上带着满意的笑容。\n\n\"林奇朋友，这场面真不错。\"福克斯拍了拍林奇的肩膀。\n\n林奇微微一笑，没有回答。他在心里计算着福克斯今天会从这场拍卖会里拿走多少——按照两人之前的协议，林奇卖出的每一件商品，利润都要和福克斯分享。这是上次欠下的人情带来的附加条件。\n\n第一件商品是一台六灶头的烹饪台，商店售价三百五十块。拍卖师从原价开始降价，喊到一百四十块时有人举了手。\n\n\"恭喜这位先生！\"拍卖师喊道。\n\n福克斯点了点头，用胳膊肘碰了碰小福克斯。\"看见了吗？这就是我说过的——林奇是个天才。\"\n\n小福克斯笑着点头。\n\n第二阶段的竞价环节，一栋公寓炒到了两万三千多。每一次报价都让福克斯的眼睛亮一下——他知道，每多卖一分钱，他拿到的就多一分钱。\n\n第三阶段，那套象牙纯银餐具从三千八百九十九块一路降到一千八百五十块才成交。福克斯摘下草帽扇了扇风。\"那套餐具，我记得我当时给了一千七。\"\n\n\"那你赚了一百五。\"林奇淡淡地说。\n\n福克斯哈哈大笑。\n\n晚上七点，拍卖会结束。林奇在办公室里算账。总交易额三十九万七千块，扣除成本、场地费、人工、拍卖师费用，以及给福克斯的\"让利\"之后，他自己的纯利润大约六万块出头。\n\n六万块。足够他进一步扩张。\n\n但林奇看着账本角落里标注着\"福克斯分账\"的那两行数字时，心里突然闪过一丝不快。不是因为在乎这两万块钱——而是因为他在想：这种人情的代价，他打算还到什么时候？\n\n他合上账本，站起来对着所有人宣布：\"今晚，去酒店。\"\n\n理查德欢呼起来。伍德也跟着笑了，但他的上司——那个混在人群里的中年男人，只是默默喝了一口汽水。\n\n林奇没有注意到他。他在想着自己的事。",

  text: "林奇本来只打算请大家吃顿饭。\n\n但福克斯先生不这么想。他坚持要在自己的农庄里举办一场烧烤派对——他说这是他的传统，每次赚了大钱就要烤一整头猪。林奇没有拒绝。不是因为他也想吃烤肉，而是因为他欠福克斯的人情。\n\n福克斯的农庄在塞宾市郊外，占地不大但打理得很精致。草地上摆了两条长桌，架子上挂着一整头烤猪，油滴在炭火上发出滋滋的声音。\n\n福克斯穿着牛仔布的衣服，亲自举着割肉刀切猪肉，一边切一边讲故事——讲他年轻的时候怎么从乡下来到塞宾市，怎么白手起家，怎么认识了林奇。\n\n说到最后，福克斯突然举起酒杯，对所有人说：\"敬林奇——我的好朋友，塞宾市最聪明的脑袋！\"\n\n来宾们纷纷举起酒杯。理查德激动得脸都红了，伍德也端起了杯子，但他注意到林奇脸上的笑容并不真诚。\n\n林奇举杯，抿了一口。他在心里想：福克斯正在用这场派对告诉所有人——他才是林奇的\"老板\"。而这正是人情债的代价。\n\n**薇菈**坐在角落里，手里拿着一个纸盘，上面放着一块烤猪肉。她看着林奇被福克斯揽着肩膀灌酒，突然觉得这个年轻人有些可怜。他明明那么聪明，却挣不脱一个地下财务公司老板的控制。\n\n但她没有说什么。她只是一个会计。\n\n派对结束后，林奇站在停车场里，等着司机来接他。福克斯走到他身边，递了一支纯色柯乐芙。\"今天很开心，林奇朋友。\"\n\n\"谢谢你的招待。\"林奇说。\n\n\"我们是朋友，互相帮助。\"福克斯拍了拍他的肩膀。\n\n林奇微笑着点头。夜色中，没有人看到他用手指掐灭了那支刚点燃的柯乐芙。",

  title: "第五章 · 摊牌与试探",
  text: "拍卖会结束后的第三天，林奇在办公室里坐了整整一个上午。\n\n他在思考一个问题：福克斯现在对他的控制有多深？\n\n答案是——不深，但够了。福克斯手上有林奇欠的\"人情\"。通过这个人情，他可以要求林奇参与他的新生意，可以影响林奇在商业上的决策，可以在市长面前以\"林奇的引荐人\"自居。\n\n这不是林奇要的局面。\n\n他拿起电话，打给了福克斯。\"福克斯先生，我需要和你谈谈。\"\n\n一个小时后，两人在福克斯的办公室里面对面坐着。林奇直接开口：\"市长要找我了。我不确定他找我是因为拍卖会，还是因为他想找一个能帮他在经济衰退中创造就业岗位的人。但不管哪种原因，我都会和他合作。\"\n\n福克斯的笑容淡了一点点。\"这是好事。有市长支持，你的拍卖会能拿到更好的场地和补贴。\"\n\n\"没错。\"林奇直视着福克斯的眼睛，\"但我需要你知道——和市长谈判的人是我，不是你。如果市长问起我们的关系，我会说我们是商业合作伙伴，仅此而已。\"\n\n福克斯沉默了好一会儿。然后他突然笑了，站起来，走到林奇面前，伸出手。\"好吧。在市长面前，你是独立的。我们之间的人情债务——以后再谈。\"\n\n林奇站起来，握住了福克斯的手。这个握手很短暂，比他们之前的任何一次都要短暂。他们之间的关系变了——从亦师亦友的默契，变成了有边界感的商业结盟。\n\n和福克斯摊牌后的第四天，林奇坐在了市长办公室里。**兰登市长**开门见山：\"你的货源主要来自盖特瑙财务公司——也就是福克斯先生。福克斯先生在本地的经营记录……不算特别干净。\"\n\n林奇微笑了一下。\"市长阁下，我提供的是合法、透明的二手商品交易平台。我的货源来自一个愿意向我出售抵押品的商人。如果市长阁下对我的财务状况感兴趣，我的账本随时可以接受审计。\"\n\n兰登市长看着林奇，看了好一会儿。然后他靠在椅背上。\"林奇先生，我问你最后一个问题。你知道联邦进步党吗？\"\n\n\"研究过。进步党主张积极融入国际社会，承担更多国际责任。这和我的商业理念一致。\"\n\n兰登市长站起来向林奇伸出了手。\"那么，当你的计划书写好之后，送来给我。让我们看看你能不能实现你承诺的那些数字。\"",
  choices: [],
  ending: "【结局：独立之路】\n\n福克斯庇护路线的林奇走了一条最艰难的路。\n\n他欠福克斯的人情，这让他从一开始就背上了额外的负担——进货价被压到八折，拍卖会上福克斯坐在贵宾席享受分账，庆祝派对变成了福克斯的个人秀场。\n\n但他没有永远低头。在市长关注到他的第一时间，他就和福克斯摊了牌——\"和市长谈判的人是我，不是你。\"\n\n福克斯退了一步。不是因为他不想要更多，而是因为他知道林奇的价值远大于那点人情债。\n\n林奇用一场不算完美但足够成功的拍卖会证明了自己的商业能力，用一次艰难的摊牌划清了自己和福克斯之间的边界，用一本随时可以公开的账本打消了市长对他灰色背景的疑虑。\n\n他的人情债还没有还完。但他已经走上了独立之路。\n\n【Demo完·感谢试玩】\n\n原著：三脚架《黑石密码》"

auction_prep_laylow: {
  title: "第五章 · 拍卖会筹备",
  text: "福克斯带着林奇走进了他的仓库。\n\n仓库里堆满了东西——桌子、椅子、油画、地毯、甚至还有一套装在精美盒子里的象牙纯银餐具。福克斯满脸愁容地站在一旁。\n\n\"林奇，这些东西太多了，卖不出去。你有什么办法吗？\"\n\n林奇在隐忍期里几乎每天都在研究市场。他每天翻阅《交易报》，注意到一个和直觉相悖的现象：工厂在倒闭，工人在失业，但交易所的股票却在不断上涨。他在笔记本上写下过一行字——\"实体经济与金融市场之间存在巨大的背离。这是泡沫的迹象。\"\n\n此时，他看着满仓库的抵押品，脑海里闪现的不是这些东西值多少钱，而是它们能在多快的时间里变现。\n\n\"福克斯先生，这些东西必须尽快卖掉。\"林奇说。\n\n福克斯皱了皱眉。\"我知道，但问题是卖给谁？\"\n\n\"我。但价格必须低。因为现在的市场和几个月前的市场已经不一样了——如果你不尽快脱手，六个月后，这些东西可能只值现在的一半。\"\n\n福克斯愣住了。\"你怎么知道？\"\n\n林奇没有解释。他只是在心里计算了一下，然后用一种自信的语气说道：\"因为我一直在看市场。\"\n\n福克斯沉默了很久。然后他点了头。\"七折。但你要一次性付清。\"\n\n林奇同意了。他的手头资金不多——隐忍期里他没有大规模扩张，能拿出来的现金有限。但他知道，这是对的时间，对的买卖。\n\n他需要团队。\n\n第二天，林奇来到就业中心招募业务员。来的人不多——他隐忍期名声不显，很多人甚至不知道他是个商人。但他用自己的话术说服了其中最积极的几个年轻人。\n\n其中一个是**理查德**，一个穿着老旧衬衫但眼神非常机灵的家伙。\n\n\"没有底薪，但利润对半分。做得好，一个月能赚别人一年的工资。\"林奇说。\n\n理查德没有任何犹豫就点了头。\n\n还有一个叫**伍德**的年轻人，很精神，做事积极。\n\n团队组建完成后，林奇站在仓库门口。他手里的资源比其他路线少——资金紧张，名声不显，团队只有寥寥几人。但他有一个别人没有的东西：对即将到来的金融风暴的预判。\n\n他知道，这场拍卖会不只是为了赚钱。它是他在这场风暴来临之前，必须完成的一步棋。",
  choices: [{ text: "⏭️ 继续", nextId: "auction_day_laylow" }]
},
auction_day_laylow: {
  title: "第五章 · 拍卖会盛况",
  text: "周六下午，仓库区。\n\n林奇站在仓库管理处的二楼窗户前，看着下方的人群。他的拍卖会规模比其他路线都小——他没有钱租体育馆，没有钱请州府的拍卖师，连传单的印刷数量都比别人少。\n\n但他有一个别人没有的东西：对市场最精准的判断。\n\n在隐忍期间，他几乎每天都会翻阅《交易报》。他注意到实体经济的衰退正在加速——工厂一家接一家倒闭，工人们抱着装满工具的纸箱走出厂门。但他也注意到，人们的消费欲望并没有消失，只是转移到了更便宜、更划算的渠道上。\n\n\"人们手里还有钱，但他们在害怕。\"他在隐忍期的笔记本上写过这段话，\"只要给他们足够的安全感，他们就会掏钱。\"\n\n现在，他用一种最简单粗暴的方式给他们安全感——底价起拍，不设上限。\n\n第一件商品是一台二手烤箱，原价一百九十九块。拍卖师从一块钱开始喊，一路喊到七十二块才有人举手。虽然成交价只有七十二块，但林奇这台烤箱的成本不到四十块。\n\n第二阶段的竞价环节，一栋小公寓拍出了一万九千块。拍下它的是一个退休的机械工程师——他的所有积蓄加起来就两万出头。他颤抖着举起手时，他的妻子在旁边拉他的袖子，但他甩开了她。一栋房子，不到两万块。\n\n第三阶段，拍卖师拿出了一套全新的餐具。从原价喊到一千五百块时有人举了手。\n\n晚上七点，拍卖会结束。\n\n总交易额只有二十二万出头——是四条路线里最低的。但林奇并不失望。他看着账本底部自己用笔重重画圈的一个数字：纯利润六万多块。\n\n在所有路线里，他的投入最小，利润率反而最高。\n\n更重要的是，他在拍卖会现场观察到了三件事：\n\n第一，出手阔绰的买家里，有好几个是福克斯的人——他们是来给拍卖会撑场面的。\n\n第二，有人在角落里记笔记。不是税务局的探员，而是市长办公室的人。\n\n第三，那些抢拍成功的客户在付款时，有好几个选择了分期。这意味着即使是在\"狂欢\"中，人们的钱包也在收紧。\n\n林奇把这几条写进了笔记本。然后他站起来，对着那些面带期待的年轻业务员们宣布：\"今晚，我们一起吃顿饭。过后，还有更多的事要做。\"",
  choices: [{ text: "⏭️ 继续", nextId: "auction_celebration_laylow" }]
},
auction_celebration_laylow: {
  title: "第五章 · 朴实的一餐",
  text: "林奇没有包酒店，也没有去任何高档餐厅。\n\n他在烧烤店里请客——那家仓库区附近、老板娘有点粗鲁、主要卖碎肉饼和全麦餐包的小店。理查德一开始有些失望，但他很快就调整了心态——毕竟他拿到了两千多块的提成，吃什么都香。\n\n林奇给大家点了碎肉饼套餐，加肉加酱，还买了几扎啤酒。大家挤在几张拼起来的长桌旁，吃得满头大汗。\n\n\"林奇先生，我们什么时候再做下一场？\"坐在林奇对面的理查德满嘴油光地问。\n\n\"再等两周。\"林奇撕了一块餐包，蘸了蘸盘子里的肉汁，\"下一场我们要做更大的——不只是塞宾市，我们把宣传单发到隔壁的城市去。\"\n\n理查德的兴奋噎了一下。\"但是我们人手不够啊。\"\n\n\"所以我们要招更多的人。\"林奇把餐包塞进嘴里，\"我打算在州内其他城市也开分公司。场地、仓储、物流——全部由我们来建。\"\n\n伍德在一旁听着，默默嚼着他的肉饼。他发现林奇总是能在事情刚刚起步的时候就想好下一步的布局。这个年轻人，和他见过的任何罪犯都不一样——如果林奇真的算得上罪犯的话。\n\n晚餐结束后，林奇一个人回了仓库。\n\n他坐在办公室里，翻开隐忍期写的那本笔记本。他翻到折角的那一页，上面写着：\"当潮水退去，才知道是谁在果泳。\"\n\n今天拍卖会现场，他看到有人在角落里记笔记——不是税务局的探员，而是市长身边的人。\n\n他在那行字下方又写了一行：\"第一步已经走完了。接下来，找对的人谈对的事。\"",
  choices: [{ text: "⏭️ 继续", nextId: "mayor_attention_laylow" }]
},
mayor_attention_laylow: {
  title: "第五章 · 有备而来",
  text: "林奇没有等市长来找他。\n\n在拍卖会结束后的第三天，他自己给市长办公室打了一个电话。接电话的是**费拉勒**，市长的亲随官。\n\n\"我叫林奇。你可能在报纸上见过我的名字。我想和市长阁下谈谈关于塞宾市经济的一些想法。\"\n\n电话那头沉默了好一会儿。费拉勒显然没有遇到过这样直接的人。他没有问林奇有什么想法，也没有问林奇为什么觉得市长会见他，只是说了一句：\"等我回复。\"\n\n林奇挂掉电话，打开他在隐忍期间写的那本笔记本。他翻到折角的那一页，上面密密麻麻记录着过去几个月《交易报》上的数据——房租涨幅、失业率、企业倒闭数量、交易所的虚假繁荣。他在页边画了一条线，线的上方是繁荣的金融市场，线的下方是越来越萧条的实体经济。线在往下掉。\n\n他合上笔记本。他知道市长一定会见他。不是因为他的拍卖会赚了多少钱，而是因为他手里有市长最需要的东西——一份对当前经济形势的准确判断。\n\n第二天，费拉勒回了电话。市长同意在周三傍晚腾出四十分钟。\n\n周三傍晚，市中心私人俱乐部的包间里，林奇坐在了**兰登市长**的对面。市长看起来很疲惫，眼袋很深，衬衫领子微微松着。这段时间经济衰退加速，不断有企业倒闭，工人们举着牌子在市政厅外游行，他每天只睡四五个小时。\n\n\"林奇先生，我的随从说你有一些关于经济的想法。\"市长的语气带着一种礼貌的疏离，\"我希望这些话值得我挤出这四十分钟。\"\n\n\"市长阁下。\"林奇身体微微前倾，\"我注意到两件事。第一件事：过去半年里，塞宾市已经有十一家工厂倒闭，失业率接近百分之二十。第二件事：联邦工业指数在同期屡创新高，交易所的交易量还在不断攀升。这两件事不可能同时为真。要么实体经济在好转——但我们每天都能看到，它在恶化。要么——金融市场的繁荣是虚假的。\"\n\n兰登市长的眉头皱了起来。这些数据他当然知道，但他是市长，不是金融分析师。他每天处理的是工人游行、企业倒闭、市政预算削减，而不是去研究为什么交易所的股票还在涨。林奇这样直接地指出其中的矛盾，让他有些不舒服，又有些警觉。\n\n\"你说的这些……有什么依据吗？\"\n\n\"您可以打开任何一期《交易报》。\"林奇用手指在桌面上比划着，\"头版永远是好消息——联邦工业指数再创新高，某某基金回报率超过百分之十五。但在中缝的小字报道里，你能找到另一组数据：两大主要战胜国正在加速从联邦撤回资金，转投战后重建国家。国际资本正在撤离联邦——这不是我编造的数据，是《交易报》自己报道的。您可以让人查一下最近几期的国际版中缝。\"\n\n兰登市长看了身边的费拉勒一眼。后者微微点头，表示他会查。\n\n\"那么根据你的这些观察，接下来会发生什么？\"\n\n\"国际资本撤离会直接抽干金融市场的流动性。交易所的繁荣是靠这些热钱撑起来的，一旦热钱走了，泡沫就会破裂。破裂之后，银行会收紧贷款，企业无法融资，倒闭潮会加速。塞宾市只是第一波——接下来还会有更多工厂关门，更多工人失业。这不是危言耸听，而是我们在过去半年里已经看到的事实。\"\n\n兰登市长把手放在桌上，沉默了好一会儿。林奇说的话他本能地想驳斥，但他的理智告诉他——这个年轻人说的是对的。他一直在和这些数据打转，但他没有把它们串成一条线。林奇帮他串了一条线。\n\n\"那么你认为应该怎么做？\"\n\n\"我目前有一家贸易公司。我的业务帮助人们的财富保值，让他们能用更少的钱满足物质需求。在您的支持下，我可以迅速扩大覆盖面——在塞宾市建立完善的二手商品交易网络，降低低收入家庭的生活成本。同时，我可以创造新的就业方向——比如创办以女性就业为主的体育赛事，缓解女性失业率。\"\n\n林奇放缓了语速。\"更重要的是，当您手上有一套正在运转的政策方案时，您就有能力向州政府证明：在面对这场危机时，您不是束手无策——您已经有了对策，而且它正在见效。这会是最有力的政治资本。\"\n\n兰登市长抬起头看着林奇。这个年轻人不只是想赚钱，他想要成为市长在这场经济衰退中的合作伙伴。他比其他人更早看到危机，他为危机做了准备，现在他把准备好的方案摆到了市长面前，要求一个合作的机会。\n\n\"你知道进步党的政治纲领吗？\"市长又问了一个不相干的问题。\n\n\"研究过。进步党主张承担更多国际责任，从人道主义救援开始，逐步把联邦推向国际舞台中心。我认为这是联邦未来唯一正确的方向——保守党的孤立主义只会让联邦被国际社会遗忘。\"\n\n兰登市长靠在椅背上，脸上浮现出一种难以捉摸的表情。\"林奇先生，我会让我的幕僚们认真研究你的提议。如果你能提供一份详细的计划书，我们下周再谈。\"\n\n林奇站起来，知道这是他该走的时候了。",
  choices: [],
  ending: "【结局：风暴之眼】\n\n暂时隐忍路线的林奇，在四条路线里拥有最少的资源，却做出了最精准的判断。\n\n他的拍卖会规模最小、交易额最低、团队最少、庆祝最朴素。但他让市长坐在办公桌前听了整整四十分钟——不是为了听一个年轻人吹嘘自己赚了多少钱，而是为了听他说清楚这个国家正在面对什么。\n\n他隐忍期间积累的知识储备——房租涨幅、失业率、企业倒闭数量、国际资本撤离——这些数据在他手里不再是散落的新闻片段，而是一条可以串联起来的线索。\n\n他让市长看见了一个比赚钱更重要的东西：洞见。\n\n当其他三条路线的林奇还在用各种方式争取市长支持时，隐忍路线的林奇已经让市长意识到——这个年轻人，不只是来要支持的。他是来送情报的。\n\n风暴即将来临。\n\n而林奇，已经站在了风暴的中心。\n\n【Demo完·感谢试玩】\n\n原著：三脚架《黑石密码》"
}

function paginateText(t) {
    if (!t) return [""];
    var ps = t.split("\n\n");
    var r = [];
    for (var i = 0; i < ps.length; i += 3) {
        r.push(ps.slice(i, i + 3).join("\n\n"));
    }
    return r;
}
function parseStoryText(t) {

        if (!introducedNPCs[n]) {
            introducedNPCs[n] = true;
            return '<strong class="npc-intro">' + n + "</strong>";
        }
        return "<strong>" + n + "</strong>";
    }).replace(/\n/g, "<br>");
}

            it.className = "sidebar-item" + (n.id === currentChapterId ? " sidebar-current" : "");
            it.textContent = n.id === currentChapterId ? "> " + n.title : n.title;
            it.addEventListener("click", function () {
                currentChapterId = n.id;
                currentPage = 0;
                var ch = storyData[currentChapterId];
                if (ch) {
                    pages = paginateText(ch.text || "");
                    renderPage();
                }
                closeSidebar();
            });
            sidebarList.appendChild(it);
        })(allNodes[i]);
    }
}
function renderSidebar() {
    sidebarList.innerHTML = "";
    for (var i = 0; i < visitedNodes.length; i++) {
        (function (n) {
            var it = document.createElement("div");
            it.className = "sidebar-item" + (n.id === currentChapterId ? " sidebar-current" : "");
            it.textContent = n.id === currentChapterId ? "> " + n.title : n.title;
            it.addEventListener("click", function () {
                currentChapterId = n.id;
                currentPage = 0;
                var ch = storyData[currentChapterId];
                if (ch) {
                    pages = paginateText(ch.text || "");
                    renderPage();
                }
                closeSidebar();
            });
            sidebarList.appendChild(it);
        })(visitedNodes[i]);
    }
}
function openSidebar() {
    sidebar.classList.add("open");
    sidebarOverlay.classList.add("show");
}
function closeSidebar() {
    sidebar.classList.remove("open");
    sidebarOverlay.classList.remove("show");
}
sidebarToggle.addEventListener("click", function () {
    sidebar.classList.contains("open") ? closeSidebar() : openSidebar();
});
sidebarOverlay.addEventListener("click", closeSidebar);

function renderPage() {
    var ch = storyData[currentChapterId];
    if (!ch) return;
    titleEl.textContent = ch.title || "";
    var page = pages[currentPage] || "";
    storyEl.innerHTML = parseStoryText(page);
    pageArea.innerHTML = "";
    if (pages.length > 1) {
        var s = document.createElement("span");
        s.className = "page-info";
        s.textContent = currentPage + 1 + "/" + pages.length;
        pageArea.appendChild(s);
    }
    if (currentPage > 0) {
        var pb = document.createElement("button");
        pb.className = "page-btn";
        pb.textContent = "← 上一页";
        pb.addEventListener("click", function () {
            currentPage--;
            renderPage();
            storyEl.scrollTop = 0;
        });
        pageArea.insertBefore(pb, pageArea.firstChild);
    }
    if (currentPage < pages.length - 1) {
        var nb = document.createElement("button");
        nb.className = "page-btn";
        nb.textContent = "下一页 →";
        nb.addEventListener("click", function () {
            currentPage++;
            renderPage();
            storyEl.scrollTop = 0;
        });
        pageArea.appendChild(nb);
    }
    choicesEl.innerHTML = "";
    if (currentPage === pages.length - 1) {
        var ccs = ch.choices || [];
        var vcs = [];
        for (var i = 0; i < ccs.length; i++) {
            var cc = ccs[i];
            if (cc.routeReq) {
                if (cc.routeReq === "ring" && routeFlags.trickedMichael) vcs.push(cc);
                else if (cc.routeReq === "media" && routeFlags.foughtMichael) vcs.push(cc);
                else if (cc.routeReq === "fox" && routeFlags.foxProtected) vcs.push(cc);
                else if (cc.routeReq === "laylow" && routeFlags.laidLow) vcs.push(cc);
            } else {
                vcs.push(cc);
            }
        }
        if (vcs.length > 0) {
            addVisitedNode(currentChapterId, ch.title, vcs.length);
            for (var j = 0; j < vcs.length; j++) {
                (function (cc) {
                    var b = document.createElement("button");
                    b.className = "choice-btn";
                    b.textContent = cc.text;
                    b.addEventListener("click", function () {
                        if (cc.setRoute) {
                            routeFlags = { foughtMichael: false, trickedMichael: false, foxProtected: false, laidLow: false };
                            if (cc.setRoute === "media") routeFlags.foughtMichael = true;
                            if (cc.setRoute === "ring") routeFlags.trickedMichael = true;
                            if (cc.setRoute === "fox") routeFlags.foxProtected = true;
                            if (cc.setRoute === "laylow") routeFlags.laidLow = true;
                        }
                        if (cc.setState) {
                            for (var k in cc.setState) {
                                routeFlags[k] = cc.setState[k];
                            }
                        }
                        if (cc.nextId) {
                            currentChapterId = cc.nextId;
                            currentPage = 0;
                            var nc = storyData[currentChapterId];
                            if (nc) {
                                pages = paginateText(nc.text || "");
                                renderPage();
                            }
                        }
                    });
                    choicesEl.appendChild(b);
                })(vcs[j]);
            }
        }
        if (ch.ending) {
            var ed = document.createElement("div");
            ed.className = "ending";
            ed.innerHTML = ch.ending.replace(/\n/g, "<br>");
            choicesEl.appendChild(ed);
            var bb = document.createElement("button");
            bb.className = "choice-btn";
            bb.textContent = "🔙 回到关键选择点";
            bb.addEventListener("click", function () {
                if (visitedNodes.length > 0) {
                    var ln = visitedNodes[visitedNodes.length - 1];
                    currentChapterId = ln.id;
                    currentPage = 0;
                    var lch = storyData[currentChapterId];
                    if (lch) {
                        pages = paginateText(lch.text || "");
                        renderPage();
                    }
                }
            });
            choicesEl.appendChild(bb);
        }
    }
    storyEl.scrollTop = 0;
}
coverStartBtn.addEventListener("click", function () {
    introducedNPCs = {};
    visitedNodes = [];
    routeFlags = { foughtMichael: false, trickedMichael: false, foxProtected: false, laidLow: false };
    renderSidebar();
    coverEl.style.display = "none";
    gameBodyEl.style.display = "flex";
    currentChapterId = "intro";
    currentPage = 0;
    var ch = storyData["intro"];
    if (ch) {
        pages = paginateText(ch.text || "");
        renderPage();
    }
});
restartBtn.addEventListener("click", function () {
    introducedNPCs = {};
    visitedNodes = [];
    routeFlags = { foughtMichael: false, trickedMichael: false, foxProtected: false, laidLow: false };
    renderSidebar();
    coverEl.style.display = "flex";
    gameBodyEl.style.display = "none";
});
coverEl.style.display = "flex";
gameBodyEl.style.display = "none";
</script>
</body>
